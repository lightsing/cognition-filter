[package]
edition = "2024"
name = "cognition-filter"
rust-version = "1.91"
version = "0.10.1"

[workspace]
default-members = [".", "plugins/bilibili", "plugins/x"]
members = ["sdk", "plugins/bilibili", "plugins/x"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
cf-site-sdk = { path = "sdk" }

[dependencies]
axum = "0.8"
base64 = "0.22"
eyre = "0.6"
fastrand = "2.5"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
hmac = "0.12"
httpdate = "1.0"
libloading = "0.8"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.27"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = 0
incremental = true
opt-level = 0

[profile.release]
strip = true

[lints]
workspace = true

[workspace.lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unused-qualifications = "warn"

[workspace.lints.clippy]
assigning-clones = "warn"
cast-lossless = "warn"
elidable-lifetime-names = "warn"
redundant-else = "warn"
single-match-else = "warn"
uninlined-format-args = "warn"
unnecessary-box-returns = "warn"
unnecessary-debug-formatting = "warn"
