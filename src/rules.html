<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="cf-token" content="__PAIRING_TOKEN__">
  <meta name="cf-title-key" content="rules.pageTitle">
  <title>过滤规则 · Cognition Filter</title>
  <link rel="stylesheet" href="/settings.css">
  <script defer src="/i18n.js"></script>
  <script defer src="/rules.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content" data-i18n="skip.toContent">跳到主要内容</a>
  <div class="app-shell">
    <header class="app-header">
      <div class="topbar">
        <div class="brand">
          <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5h17l-6.5 7.8V19l-4 2v-8.2L3.5 5z"/></svg></span>
          <div class="brand-text">
            <span class="brand-name" data-i18n="app.name">Cognition Filter</span>
            <span class="app-subtitle" data-i18n="app.subtitle">本地语义过滤代理</span>
          </div>
        </div>
        <label class="lang-control">
          <span data-i18n="lang.label">语言</span>
          <select id="lang-select">
            <option value="zh-CN">简体中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
      <nav class="agent-nav" data-i18n-attr="aria-label:nav.ariaLabel" aria-label="本地 agent 导航">
        <a id="nav-settings" href="/settings" data-i18n="nav.settings">设置</a>
        <a id="nav-plugins" href="/settings#plugins" data-i18n="nav.plugins">站点插件</a>
        <a id="nav-rules" href="/rules" aria-current="page" data-i18n="nav.rules">过滤规则</a>
        <a id="nav-stats" href="/stats" data-i18n="nav.stats">过滤统计</a>
        <a id="nav-pairing" href="/" data-i18n="nav.pairing">浏览器配对</a>
      </nav>
      <div class="page-head">
        <div class="page-head-text">
          <h1 data-i18n="rules.heading">过滤规则</h1>
          <p class="page-lead" data-i18n="rules.lead">管理语义过滤规则组，以及每组的匹配与排除条件。</p>
        </div>
        <span id="draft-badge" class="state-badge" data-i18n="rules.badge.connecting">正在连接</span>
      </div>
    </header>

    <main id="main-content">
      <form id="rules-form" autocomplete="off">
        <fieldset id="fields" disabled>
          <section class="card-section" aria-labelledby="groups-heading">
            <div class="section-head rules-section-head">
              <div>
                <h2 id="groups-heading" data-i18n="rules.groups.title">规则组</h2>
                <p data-i18n="rules.groups.desc">最多 24 个规则组；每组包含 1–8 条匹配条件与最多 8 条排除条件。</p>
              </div>
              <div class="rules-section-actions">
                <span id="group-count" class="rules-count" aria-live="polite">0 / 24</span>
                <button class="secondary" id="add-group" type="button" data-i18n="rules.groups.add">添加规则组</button>
              </div>
            </div>
            <div id="groups-list" class="rules-groups"></div>
            <p id="groups-empty" class="empty-note" hidden data-i18n="rules.groups.empty">暂无规则组。点击“添加规则组”创建第一条规则。</p>
          </section>
        </fieldset>

        <footer class="form-footer" id="form-footer">
          <div id="status" role="status" aria-live="polite" data-i18n="rules.status.connecting">正在连接本地 agent…</div>
          <div class="actions">
            <button class="secondary" id="reload" type="button" data-i18n="rules.actions.reload">重新读取</button>
            <button class="primary" id="save" type="submit" disabled data-i18n="rules.actions.save">保存规则</button>
          </div>
        </footer>
      </form>

      <noscript data-i18n="rules.noscript">请启用 JavaScript 以读取和保存过滤规则。</noscript>
    </main>
  </div>
</body>
</html>
